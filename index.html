<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="樽見OTO鉄道の景観シーケンサー。GPS走行記録やダイヤを再生し、駅・トンネルの合図と走行位置を確認できます。" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preload" href="/fonts/TarumiOTOStroke-Regular.otf" as="font" type="font/otf" crossorigin />
  <title>樽見OTO鉄道 · Sequencer</title>
  <style>
    #loading { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #fff; color: #000; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    #loading[hidden] { display: none !important; }
    #loading .loading-logo { display: block; width: min(320px, 72vw); height: 54px; background: currentColor; mask: url('/logos/header-logo.svg') center / contain no-repeat; }
    #loading h2 { margin: 15px 20px 0; font-size: 20px; font-weight: 500; }
    #loading p { margin: 0; padding: 0 25px; font-size: 13px; }
  </style>
</head>

<body>
  <div id="loading" role="status"><span class="loading-logo" role="img" aria-label="樽見OTO鉄道"></span><h2>読み込んでいます</h2><p>樽見鉄道の路線とダイヤ</p></div>
  <script type="module" src="/src/entry.js"></script>
</body>

</html>

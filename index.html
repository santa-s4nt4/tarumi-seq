  <style>
    #loading { position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #fff; color: #000; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    #loading[hidden] { display: none !important; }
    /* The name is written stroke by stroke along the Tarumi font's centre lines
       (the font's stroke data: 60 units wide, round ends), each character in
       its stroke order, the seven overlapping to finish in one second. */
    #loading .splash-logo { display: block; width: min(320px, 72vw); height: auto; overflow: visible; }
    #loading .splash-logo path { fill: none; stroke: currentColor; stroke-width: 60; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; visibility: hidden; animation: splash-write var(--d) ease-in-out var(--t) forwards; }
    @keyframes splash-write { from { stroke-dashoffset: 1; visibility: visible; } to { stroke-dashoffset: 0; visibility: visible; } }
    @media (prefers-reduced-motion: reduce) { #loading .splash-logo path { animation: none; visibility: visible; } }
    #loading h2 { margin: 15px 20px 0; font-size: 20px; font-weight: 500; }
    #loading p { margin: 0; padding: 0 25px; font-size: 13px; }
    #loading :is(h2, p):empty { display: none; }
  </style>
